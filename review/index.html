<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>keyturn review</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <header class="top">
      <h1 class="mark">keyturn</h1>
      <span class="who" id="who"></span>
      <nav class="views" aria-label="Which proposals">
        <button type="button" id="view-waiting" aria-pressed="true">Waiting <span id="count-waiting"></span></button>
        <button type="button" id="view-decided" aria-pressed="false">Decided</button>
      </nav>
    </header>
    <p class="lost" id="lost" role="alert" hidden></p>
    <div class="frame">
      <nav class="queue" id="queue" aria-label="Proposals"></nav>
      <main class="sheet" id="sheet" tabindex="-1"></main>
    </div>
    <div class="keys" id="keys" hidden></div>
    <p class="said" id="said" role="status" aria-live="polite"></p>
    <script type="module" src="/app.js"></script>
  </body>
</html>
