<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>keyturn review</title>
    <link rel="stylesheet" href="/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 112 112' fill='none'%3E%3Cstyle%3E.i%7Bfill:%231e1a17%7D@media (prefers-color-scheme:dark)%7B.i%7Bfill:%23f1ece6%7D%7D%3C/style%3E%3Crect class='i' x='20' y='14' width='20' height='84' rx='6'/%3E%3Cpath d='M48 46 A32 32 0 0 0 80 14' stroke='%23ea580c' stroke-width='20'/%3E%3Cpath class='i' d='M48 64 H63 L94 98 H69 L48 75 Z'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="top">
      <h1 class="mark">
        <svg viewBox="0 0 112 112" width="18" height="18" fill="none" aria-hidden="true">
          <rect x="20" y="14" width="20" height="84" rx="6" fill="currentColor" />
          <path class="turn" d="M48 46 A32 32 0 0 0 80 14" stroke-width="20" />
          <path d="M48 64 H63 L94 98 H69 L48 75 Z" fill="currentColor" />
        </svg>
        keyturn
      </h1>
      <span class="who" id="who"></span>
      <nav class="views" aria-label="Which proposals">
        <button type="button" id="view-waiting" aria-pressed="true">Waiting <span id="count-waiting"></span></button>
        <button type="button" id="view-decided" aria-pressed="false">Decided</button>
      </nav>
    </header>
    <p class="lost" id="lost" role="alert" hidden></p>
    <div class="frame">
      <nav class="queue" id="queue" aria-label="Proposals"></nav>
      <main class="sheet" id="sheet" tabindex="-1"></main>
    </div>
    <div class="keys" id="keys" hidden></div>
    <p class="said" id="said" role="status" aria-live="polite"></p>
    <script type="module" src="/app.js"></script>
  </body>
</html>
