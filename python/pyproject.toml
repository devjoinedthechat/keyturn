[project]
name = "keyturn"
version = "0.1.0"
description = "PostgreSQL refuses an AI agent's write until a person has approved that exact change."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["psycopg>=3.2,<4"]
keywords = ["postgres", "postgresql", "ai-agents", "human-in-the-loop", "approval", "audit"]

[dependency-groups]
dev = [
  "psycopg[binary]>=3.2,<4",
  "pytest>=8",
  "testcontainers[postgres]>=4.8",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keyturn"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and build their own schema from fixed text.
"tests/*" = ["S101", "S608"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
